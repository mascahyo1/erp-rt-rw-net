name: Add new issues to project

on:
  issues:
    types: [opened]
  workflow_dispatch:

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      projects: write
    steps:
      - name: Add issue to project
        uses: actions/add-to-project@v1
        with:
          project-url: https://github.com/users/mascahyo1/projects/1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          labeled: documentation,enhancement,user-guide,bug
